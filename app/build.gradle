def coverageReport = tasks.register('jacocoDebugReport', JacocoReport) {
    dependsOn coverageInputs
    sourceDirectories.setFrom files('src/main/java', 'src/main/kotlin')
    classDirectories.setFrom debugClasses
    executionData.setFrom debugCoverageData
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn coverageReport
    sourceDirectories.setFrom files('src/main/java', 'src/main/kotlin')
    classDirectories.setFrom debugClasses
    executionData.setFrom debugCoverageData
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
    // Run before Ant's verifier: independently rejects zero denominator, stale reports,
    // inventory omissions and changed data, and binds the successful XML to this run.
    doFirst {
        providers.exec {
            workingDir rootProject.projectDir
            commandLine 'python3', 'tools/build/coverage_gate.py', 'report'
        }.result.get().assertNormalExitValue()
    }
}
apply from: rootProject.file('tools/build/always-execute.gradle')

// Configuration cache is explicitly disabled in the hosted gate. These are observed
// terminal task states, not inferred from banners or the aggregate process exit.
gradle.taskGraph.afterTask { task, state ->
    if (task.path in [':app:testDebugUnitTest', ':app:connectedDebugAndroidTest',
                     ':app:collectDebugCoverageInputs', ':app:jacocoDebugReport', ':app:jacocoDebugCoverageVerification']) {
        def outcome = state.failure ? 'FAILED' : state.noSource ? 'NO_SOURCE' :
            state.upToDate ? 'UP_TO_DATE' : state.skipped ? 'SKIPPED' : 'SUCCESS'
        logger.lifecycle("COVERAGE_TASK_OUTCOME ${task.path} ${outcome}")
    }
}
