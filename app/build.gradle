abstract class DebugCoverageInputs extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<RegularFile> getClassJars()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<Directory> getClassDirs()
    @Classpath abstract ConfigurableFileCollection getAnalyzerClasspath()
    @Inject abstract ExecOperations getExecOperations()
    @OutputDirectory abstract DirectoryProperty getSnapshot()

    @TaskAction
    void collect() {
        def base = project.rootProject.projectDir
        def output = snapshot.get().asFile
        output.mkdirs()
        def loader = new URLClassLoader(analyzerClasspath.files.collect { it.toURI().toURL() } as URL[], (ClassLoader) null)
        try {
            def analyzerVersion = loader.loadClass('org.jacoco.core.JaCoCo').getField('VERSION').get(null)
            if (analyzerVersion != '0.8.15.202606040825') {
                throw new GradleException('Resolved analyzer is not audited JaCoCo 0.8.15')
            }
            def newInstance = { name -> loader.loadClass(name).getDeclaredConstructor().newInstance() }
            def storeClass = loader.loadClass('org.jacoco.core.data.ExecutionDataStore')
            def visitorClass = loader.loadClass('org.jacoco.core.analysis.ICoverageVisitor')
            def analyzerClass = loader.loadClass('org.jacoco.core.analysis.Analyzer')
            def handwrittenSources = project.fileTree('src/main').matching {
                include '**/*.kt', '**/*.java'
            }.files.collect { it.name } as Set
            def classes = []
            def excluded = []
            def names = [] as Set
            def addClass = { String entry, byte[] bytes ->
                def builder = newInstance('org.jacoco.core.analysis.CoverageBuilder')
                def analyzer = analyzerClass.getConstructor(storeClass, visitorClass)
                    .newInstance(newInstance('org.jacoco.core.data.ExecutionDataStore'), builder)
                analyzer.analyzeClass(bytes, entry)
                def coverage = builder.classes.iterator().next()
                def name = coverage.name
                if (!names.add(name)) throw new GradleException("Duplicate project class: ${name}")
                // Platform-generated identities only. Compose, lambdas, Activity and companions stay.
                def simple = name.tokenize('/').last()
                if (simple == 'R' || simple.startsWith('R$') || simple == 'BuildConfig' ||
                    simple == 'Manifest' || simple.startsWith('Manifest$')) {
                    if (handwrittenSources.contains(coverage.sourceFileName)) {
                        throw new GradleException("Refusing to exclude handwritten platform-like class: ${name}")
                    }
                    excluded.add([name: name, reason: 'Android generated platform class'])
                } else {
                    def file = new File(output, name + '.class')
                    file.parentFile.mkdirs()
                    file.bytes = bytes
                    classes.add([name: name, classId: Long.toUnsignedString(coverage.id, 16),
                        source: coverage.sourceFileName, instructions: coverage.instructionCounter.totalCount,
                        path: base.toPath().relativize(file.toPath()).toString(),
                        sha256: MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()])
                }
            }
            classDirs.get().each { directory ->
                project.fileTree(directory.asFile).matching { include '**/*.class' }.files.sort().each { file ->
                    addClass(directory.asFile.toPath().relativize(file.toPath()).toString(), file.bytes)
                }
            }
            classJars.get().each { jar ->
                new ZipFile(jar.asFile).withCloseable { zip ->
                    zip.entries().toList().findAll { !it.directory && it.name.endsWith('.class') }.sort { it.name }.each { entry ->
                        addClass(entry.name, zip.getInputStream(entry).withCloseable { it.bytes })
                    }
                }
            }
            // Analyze the complete snapshot together: JaCoCo's cross-class Kotlin
            // inline fragments can alter counters when CoverageBuilder builds a bundle.
            def aggregate = newInstance('org.jacoco.core.analysis.CoverageBuilder')
            def aggregateAnalyzer = analyzerClass.getConstructor(storeClass, visitorClass)
                .newInstance(newInstance('org.jacoco.core.data.ExecutionDataStore'), aggregate)
            aggregateAnalyzer.analyzeAll(output)
            aggregate.classes.each { coverage ->
                classes.find { it.name == coverage.name }.instructions = coverage.instructionCounter.totalCount
            }
            def unit = new File(project.buildDir, 'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec')
            def nativeDirectory = new File(project.buildDir, 'outputs/code_coverage/debugAndroidTest/connected')
            def nativeFiles = project.fileTree(nativeDirectory) {
                include '**/*.ec'
            }.files.sort()
            // A missing JVM dataset is not an ADB collection failure.
            if (!unit.isFile()) throw new GradleException('Missing JVM exec coverage data')
            if (nativeFiles.empty) {
                def relative = base.toPath().relativize(nativeDirectory.toPath()).toString()
                new File(output.parentFile, 'collection-failure.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    kind: 'native', reason: 'missing', path: relative])) + '\n'
                throw new GradleException("Missing native ec coverage data under: ${relative}")
            }
            def union = newInstance('org.jacoco.core.tools.ExecFileLoader')
            def datasets = ([unit] + nativeFiles).collect { file ->
                def kind = file == unit ? 'jvm' : 'native'
                def relative = base.toPath().relativize(file.toPath()).toString()
                // AGP's exec-out collector can return exit=0 on a disconnected
                // transport with zero/truncated stdout. Record the exact failure
                // before rejecting it; never let an incomplete dataset reach the report.
                def rejectCollection = { reason ->
                    new File(output.parentFile, 'collection-failure.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                        kind: kind, reason: reason, path: relative, bytes: file.length(),
                        modifiedMillis: file.lastModified(),
                        sha256: MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()])) + '\n'
                }
                if (file.length() == 0) {
                    rejectCollection('empty')
                    throw new GradleException("Empty ${kind} execution data (0 bytes): ${relative}")
                }
                def execution = newInstance('org.jacoco.core.tools.ExecFileLoader')
                try {
                    execution.load(file)
                } catch (java.io.EOFException failure) {
                    rejectCollection('truncated')
                    throw new GradleException("Truncated ${kind} JaCoCo execution data (${file.length()} bytes): ${relative}", failure)
                }
                union.load(file) // also rejects conflicting probe counts within the union
                [kind: file == unit ? 'jvm' : 'native', path: base.toPath().relativize(file.toPath()).toString(),
                 bytes: file.length(), modifiedMillis: file.lastModified(),
                 sessions: execution.sessionInfoStore.infos.collect { session ->
                     [startMillis: session.startTimeStamp, dumpMillis: session.dumpTimeStamp]
                 },
                 records: execution.executionDataStore.contents.collect { record ->
                     [name: record.name, classId: Long.toUnsignedString(record.id, 16), probes: record.probes.length]
                 }.sort { it.name }]
            }
            def tooling = analyzerClasspath.files.sort().collect { file ->
                [file: file.name, sha256: MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()]
            }
            def resolvedTools = []
            project.configurations.findAll { it.canBeResolved && it.name in ['jacocoAgent', 'jacocoAnt', 'androidJacocoAnt'] }.each { configuration ->
                configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    def id = artifact.moduleVersion.id
                    if (id.group == 'org.jacoco' && id.version != '0.8.15') {
                        throw new GradleException("Incompatible JaCoCo tooling: ${id}")
                    }
                    resolvedTools.add([configuration: configuration.name, group: id.group, module: id.name,
                        version: id.version, file: artifact.file.name,
                        sha256: MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()])
                }
            }
            def inventory = [resolvedCoverageArtifacts: resolvedTools.sort { it.toString() }, classes: classes.sort { it.name }, excluded: excluded.sort { it.name }, datasets: datasets,
                tooling: tooling, analyzerVersion: analyzerVersion, jacocoVersion: '0.8.15', scopedInputs: [jars: classJars.get()*.asFile*.toString(),
                directories: classDirs.get()*.asFile*.toString()]]
            new File(output.parentFile, 'inventory.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(inventory)) + '\n'
            execOperations.exec { workingDir base; commandLine 'python3', 'tools/build/coverage_gate.py', 'inputs' }
        } finally {
            loader.close()
        }
    }
}


abstract class ReleaseRuntimeInputs extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<RegularFile> getClassJars()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<Directory> getClassDirs()
    @InputDirectory abstract DirectoryProperty getApkDirectory()
    @OutputDirectory abstract DirectoryProperty getDestination()
    @Input String buildInputsJson
    @Internal def runtimeConfiguration

    @TaskAction
    void collect() {
        def sha = { byte[] bytes -> MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
        def coordinate = { id ->
            if (id instanceof ModuleComponentIdentifier) return "${id.group}:${id.module}:${id.version}".toString()
            if (id instanceof ProjectComponentIdentifier && id.projectPath == ':app') return 'app'
            throw new GradleException("Unsupported runtime project/file component: ${id}")
        }
        def nodes = [:]
        def edges = [] as Set
        def addNode = { id ->
            def key = coordinate(id)
            if (!nodes.containsKey(key)) nodes[key] = [id: key, variants: []]
            key
        }
        def addVariant
        addVariant = { variant ->
            def key = addNode(variant.owner)
            def attributes = variant.attributes.keySet().collectEntries { attr ->
                [(attr.name): variant.attributes.getAttribute(attr).toString()]
            }
            def value = [name: variant.displayName, attributes: attributes,
                capabilities: variant.capabilities.collect { "${it.group}:${it.name}:${it.version}".toString() }.sort()]
            if (!nodes[key].variants.contains(value)) nodes[key].variants.add(value)
            if (variant.externalVariant.present) {
                def external = variant.externalVariant.get()
                def target = addNode(external.owner)
                edges.add([from: key, to: target, constraint: false])
                addVariant(external)
            }
        }
        // Execution-time resolution of this exact variant, never build/test configurations.
        runtimeConfiguration.incoming.resolutionResult.allComponents.each { component ->
            def from = addNode(component.id)
            component.variants.each { addVariant(it) }
            component.dependencies.each { dep ->
                if (!(dep instanceof ResolvedDependencyResult)) throw new GradleException("Unresolved runtime edge: ${dep}")
                def to = addNode(dep.selected.id)
                edges.add([from: from, to: to, constraint: dep.constraint])
                addVariant(dep.resolvedVariant)
            }
        }
        def artifactsByKey = [:]
        runtimeConfiguration.incoming.artifacts.artifacts.each { artifact ->
            addVariant(artifact.variant)
            def file = artifact.file
            def row = [component: addNode(artifact.id.componentIdentifier), filename: file.name,
                       path: file.absolutePath, size: file.length(), sha256: sha(file.bytes)]
            // Publication and ad-hoc variants can expose the same selected archive.
            // Match the consumer's component/filename identity, retaining every variant above.
            def key = [row.component, row.filename]
            if (artifactsByKey.containsKey(key) && artifactsByKey[key] != row) {
                throw new GradleException("Conflicting resolved runtime artifact: ${key}")
            }
            artifactsByKey[key] = row
        }
        def artifacts = artifactsByKey.values().toList().sort { a, b -> (a.component <=> b.component) ?: (a.filename <=> b.filename) }
        def projectClasses = [] as Set
        classDirs.get().each { directory ->
            project.fileTree(directory.asFile).matching { include '**/*.class' }.files.each { file ->
                projectClasses.add(directory.asFile.toPath().relativize(file.toPath()).toString().replace('/', '.').replaceAll(/\.class$/, ''))
            }
        }
        classJars.get().each { jar ->
            new ZipFile(jar.asFile).withCloseable { zip ->
                zip.entries().toList().findAll { !it.directory && it.name.endsWith('.class') }.each {
                    projectClasses.add(it.name.replace('/', '.').replaceAll(/\.class$/, ''))
                }
            }
        }
        def apks = project.fileTree(apkDirectory.get().asFile).matching { include '*.apk' }.files
        if (apks.size() != 1) throw new GradleException('Runtime inventory requires exactly one release APK')
        def apk = apks.first()
        def receipt = [schema: 1, kind: 'release-runtime-resolution', variant: 'release',
            configuration: runtimeConfiguration.name, buildInputs: new groovy.json.JsonSlurper().parseText(buildInputsJson),
            apk: [filename: apk.name, size: apk.length(), sha256: sha(apk.bytes)],
            components: nodes.values().sort { it.id }, edges: edges.toList().sort { it.toString() },
            artifacts: artifacts, projectClasses: projectClasses.toList().sort()]
        def output = destination.get().asFile
        output.mkdirs()
        new File(output, 'runtime-resolution.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(receipt)) + '\n'
    }
}

// One resolver serves Gradle and independent hosted APK expectations. No network fallback.
def versionOutput = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build/version_identity.py'
}.standardOutput.asText.get()
def buildIdentity = new groovy.json.JsonSlurper().parseText(versionOutput)

android {
    namespace 'io.github.leugenea.codexbarmobile'
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.leugenea.codexbarmobile'
        minSdk 26
        targetSdk 37
        versionCode buildIdentity.versionCode
        versionName buildIdentity.versionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testCoverage { jacocoVersion = '0.8.15' }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
    }
}
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui:1.12.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.work:work-testing:2.12.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.12.1'
}

jacoco { toolVersion = '0.8.15' }
// AGP 9.4.1 registers its transform using a hard-coded 0.8.14 default.
// Resolve the actual tool binaries consistently; do not mutate AGP internals.
configurations.configureEach {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'org.jacoco') {
            dependency.useVersion('0.8.15')
            dependency.because('Audited compatible JVM/native JaCoCo union')
        }
    }
}

def prepareCoverage = tasks.register('prepareDebugCoverage', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build/coverage_gate.py', 'prepare'
}
tasks.configureEach { task ->
    if (task.name in ['testDebugUnitTest', 'connectedDebugAndroidTest']) {
        task.dependsOn prepareCoverage
    }
}

def coverageInputs = tasks.register('collectDebugCoverageInputs', DebugCoverageInputs) {
    dependsOn 'testDebugUnitTest', 'connectedDebugAndroidTest'
    analyzerClasspath.from configurations.jacocoAnt
    snapshot.set(layout.buildDirectory.dir('coverage-gate/classes'))
}
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    variant.artifacts.forScope(ScopedArtifacts.Scope.PROJECT).use(coverageInputs).toGet(
        ScopedArtifact.CLASSES.INSTANCE, { it.classJars }, { it.classDirs })
}
androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
    if (variant.name != 'release' || android.buildTypes.release.minifyEnabled || android.buildTypes.release.shrinkResources) {
        throw new GradleException('Runtime inventory supports one unflavored, unminified, non-resource-shrunk release')
    }
    def runtimeInputs = tasks.register('collectReleaseRuntimeInventory', ReleaseRuntimeInputs) {
        dependsOn 'assembleRelease'
        buildInputsJson = versionOutput
        runtimeConfiguration = variant.runtimeConfiguration
        apkDirectory.set(variant.artifacts.get(SingleArtifact.APK.INSTANCE))
        destination.set(layout.buildDirectory.dir('runtime-release'))
    }
    variant.artifacts.forScope(ScopedArtifacts.Scope.PROJECT).use(runtimeInputs).toGet(
        ScopedArtifact.CLASSES.INSTANCE, { it.classJars }, { it.classDirs })
}

def debugClasses = fileTree(layout.buildDirectory.dir('coverage-gate/classes')) { include '**/*.class' }
def debugCoverageData = files(
    layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'),
    fileTree(layout.buildDirectory.dir('outputs/code_coverage/debugAndroidTest/connected')) { include '**/*.ec' })

