name: M0 research contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: M0 contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.15'
          check-latest: false
      - name: Install hash-pinned research dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/research/requirements.txt
      - name: Validate offline M0 artifacts
        run: python -B -m unittest discover -s tools/research -p 'test_*.py' -v
