name: M1 toolchain checkpoint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: M1 strict toolchain checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # runner.temp is unavailable in job env; keep the cache outside checkout.
      GRADLE_USER_HOME: ${{ github.workspace }}/../m1-gradle-strict
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Record exact candidate and audited metadata
        run: |
          mkdir -p evidence
          cp gradle/verification-metadata.xml evidence/committed-verification-metadata.xml
          cp docs/build/m1-integrity.json evidence/committed-integrity-provenance.json
          python3 tools/build/write_m1_evidence.py provenance
          printf 'setup_started_utc=%s\ngradle_user_home=%s\ncache_provider=basic\n' \
            "$(date -u +%FT%TZ)" "$GRADLE_USER_HOME" > evidence/setup-timings.txt
      - name: Cheap offline scaffold contract
        run: python3 -B -m unittest discover -s tools/build -p 'test_*.py' -v
      - name: Set up Temurin JDK 17
        id: java
        timeout-minutes: 5
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          java-package: jdk
          architecture: x64
          overwrite-settings: false
      - name: Select isolated Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1-sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$RUNNER_TEMP/m1-sdk" "$RUNNER_TEMP/m1-sdk" >> "$GITHUB_ENV"
      - name: Set up Android command-line tools
        id: android
        timeout-minutes: 5
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902' # Build ID maps to tools directory 22.0
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install named project SDK packages and verify observed toolchain
        id: install
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p evidence
          sdkmanager="$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager"
          timeout 30 "$sdkmanager" --version > evidence/sdkmanager-version.txt 2>&1
          timeout --signal=TERM --kill-after=30s 10m "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 \
            --install 'platforms;android-37.0' 'build-tools;36.0.0' 2>&1 | tee evidence/sdk-install.log
          bash tools/build/install-hosted-toolchain.sh
      - name: Set up Gradle dependency cache and wrapper validation
        id: gradle
        timeout-minutes: 5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-disabled: false
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          validate-wrappers: true
          allow-snapshot-wrappers: false
          dependency-graph: disabled
          build-scan-publish: false
          add-job-summary: always
          add-job-summary-as-pr-comment: never
      - name: Strict committed verification (mandatory; no metadata generation)
        if: steps.install.outcome == 'success'
        run: |
          printf 'setup_completed_utc=%s\n' "$(date -u +%FT%TZ)" >> evidence/setup-timings.txt
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification strict --no-build-cache --no-configuration-cache --rerun-tasks \
            --stacktrace --info --continue \
            -I tools/build/toolchain.init.gradle :app:m1ToolchainCheckpoint \
            :app:lintDebug :app:assembleDebug :app:compileDebugUnitTestKotlin \
            :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:assembleDebugAndroidTest \
            2>&1 | tee evidence/strict.log
          python3 tools/build/verify_m1_manifests.py
          python3 tools/build/verify_m1_test_reports.py jvm
      - name: Bind evidence to exact files (all outcomes)
        if: always()
        env:
          JAVA_SETUP_OUTCOME: ${{ steps.java.outcome }}
          SDK_SETUP_OUTCOME: ${{ steps.install.outcome }}
          GRADLE_SETUP_OUTCOME: ${{ steps.gradle.outcome }}
          ANDROID_SETUP_OUTCOME: ${{ steps.android.outcome }}
        run: |
          mkdir -p evidence
          printf 'evidence_bound_utc=%s\njava_setup_outcome=%s\nsdk_setup_outcome=%s\ngradle_setup_outcome=%s\nandroid_setup_outcome=%s\n' \
            "$(date -u +%FT%TZ)" "$JAVA_SETUP_OUTCOME" "$SDK_SETUP_OUTCOME" "$GRADLE_SETUP_OUTCOME" "$ANDROID_SETUP_OUTCOME" >> evidence/setup-timings.txt
          # Post-action saves happen after upload; this is not a cache-save receipt.
          python3 tools/build/write_m1_evidence.py manifest
      - name: Upload exact strict/build evidence (all outcomes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
            app/build/intermediates/merged_manifests/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  native:
    name: M1 native offline smoke
    needs: checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # Same home is inherited by setup-gradle and every wrapper invocation.
      GRADLE_USER_HOME: ${{ github.workspace }}/../m1-gradle-native-strict
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Record source identity and setup start
        run: |
          mkdir -p evidence/native
          : > evidence/native/emulator.log
          python3 tools/build/write_m1_evidence.py provenance
          printf 'setup_started_utc=%s\ngradle_user_home=%s\ncache_provider=basic\n' \
            "$(date -u +%FT%TZ)" "$GRADLE_USER_HOME" > evidence/setup-timings.txt
          cp gradle/verification-metadata.xml evidence/committed-verification-metadata.xml
          cp docs/build/m1-integrity.json evidence/committed-integrity-provenance.json
      - name: Set up Temurin JDK 17
        id: java
        timeout-minutes: 5
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          java-package: jdk
          architecture: x64
          overwrite-settings: false
      - name: Select isolated Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1-sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$RUNNER_TEMP/m1-sdk" "$RUNNER_TEMP/m1-sdk" >> "$GITHUB_ENV"
      - name: Set up Android command-line tools
        id: android
        timeout-minutes: 5
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902' # Build ID maps to tools directory 22.0
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install named project SDK packages and verify observed toolchain
        id: install
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p evidence
          sdkmanager="$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager"
          timeout 30 "$sdkmanager" --version > evidence/sdkmanager-version.txt 2>&1
          timeout --signal=TERM --kill-after=30s 10m "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 \
            --install 'platforms;android-37.0' 'build-tools;36.0.0' 2>&1 | tee evidence/sdk-install.log
          bash tools/build/install-hosted-toolchain.sh
      - name: Set up Gradle dependency cache and wrapper validation
        id: gradle
        timeout-minutes: 5
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-disabled: false
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          validate-wrappers: true
          allow-snapshot-wrappers: false
          dependency-graph: disabled
          build-scan-publish: false
          add-job-summary: always
          add-job-summary-as-pr-comment: never
      - name: Prepare hosted emulator client library
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p evidence/native
          # Ubuntu host prerequisite, not a project/toolchain version pin.
          library=/usr/lib/x86_64-linux-gnu/libpulse.so.0
          record_prerequisite() {
            status=$?
            trap - EXIT
            set +e
            {
              printf 'host_prerequisite_exit=%s\nlibrary=%s\n' "$status" "$library"
              dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' libpulse0
              printf 'package_query_exit=%s\n' "$?"
              if [[ -r "$library" ]]; then
                printf '%s\n' 'library_readable=true'
                readlink -f "$library"
                sha256sum "$library"
              else
                printf '%s\n' 'library_readable=false'
              fi
            } > evidence/native/host-libpulse0-receipt.txt 2>&1
            exit "$status"
          }
          trap record_prerequisite EXIT
          timeout --signal=TERM --kill-after=15s 2m sudo apt-get -o APT::Update::Error-Mode=any update \
            2>&1 | tee evidence/native/host-apt-update.log
          timeout --signal=TERM --kill-after=15s 2m sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends libpulse0 \
            2>&1 | tee evidence/native/host-libpulse0-install.log
          dpkg-query -W -f='${db:Status-Status}\n' libpulse0 | grep -Fx installed
          test -r "$library"
      - name: Require hosted KVM access
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run complete M1 native graph on API 36 phone (strict cached dependencies)
        timeout-minutes: 35
        run: |
          printf 'setup_completed_utc=%s\n' "$(date -u +%FT%TZ)" >> evidence/setup-timings.txt
          timeout --signal=TERM --kill-after=30s 32m bash tools/build/run-hosted-native-smoke.sh
      - name: Bind native evidence and exact APK/report bytes (all outcomes)
        if: always()
        env:
          JAVA_SETUP_OUTCOME: ${{ steps.java.outcome }}
          SDK_SETUP_OUTCOME: ${{ steps.install.outcome }}
          GRADLE_SETUP_OUTCOME: ${{ steps.gradle.outcome }}
          ANDROID_SETUP_OUTCOME: ${{ steps.android.outcome }}
        run: |
          printf 'evidence_bound_utc=%s\njava_setup_outcome=%s\nsdk_setup_outcome=%s\ngradle_setup_outcome=%s\nandroid_setup_outcome=%s\n' \
            "$(date -u +%FT%TZ)" "$JAVA_SETUP_OUTCOME" "$SDK_SETUP_OUTCOME" "$GRADLE_SETUP_OUTCOME" "$ANDROID_SETUP_OUTCOME" >> evidence/setup-timings.txt
          # Post-action saves happen after upload; this is not a cache-save receipt.
          python3 tools/build/write_m1_evidence.py manifest
      - name: Upload native evidence (all outcomes; screenshots diagnostic only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/
            app/build/intermediates/merged_manifests/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
