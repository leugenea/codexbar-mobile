name: M1 toolchain checkpoint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: M1 strict toolchain checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Record exact candidate and audited metadata
        run: |
          mkdir -p evidence
          cp gradle/verification-metadata.xml evidence/committed-verification-metadata.xml
          cp docs/build/m1-integrity.json evidence/committed-integrity-provenance.json
          python3 tools/build/write_m1_evidence.py provenance
      - name: Cheap offline scaffold contract
        run: python3 -B -m unittest discover -s tools/build -p 'test_*.py' -v
      - name: Install and verify exact M0 JDK and SDK archives
        id: install
        run: bash tools/build/install-hosted-toolchain.sh
      - name: Strict committed verification (mandatory; no metadata generation)
        if: steps.install.outcome == 'success'
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/m1-gradle-strict
        run: |
          [[ ! -e "$GRADLE_USER_HOME" ]] || { printf '%s\n' 'Strict Gradle home must start fresh' >&2; exit 1; }
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification strict --stacktrace --info --continue \
            -I tools/build/toolchain.init.gradle :app:m1ToolchainCheckpoint \
            :app:lintDebug :app:assembleDebug :app:compileDebugUnitTestKotlin \
            :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:assembleDebugAndroidTest \
            2>&1 | tee evidence/strict.log
          python3 tools/build/verify_m1_manifests.py
          python3 tools/build/verify_m1_test_reports.py jvm
      - name: Bind evidence to exact files (all outcomes)
        if: always()
        run: |
          mkdir -p evidence
          python3 tools/build/write_m1_evidence.py manifest
      - name: Upload exact strict/build evidence (all outcomes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
            app/build/intermediates/merged_manifests/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  native:
    name: M1 native offline smoke
    needs: checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Record source identity and host SDK location
        run: |
          mkdir -p evidence/native
          : > evidence/native/emulator.log
          python3 tools/build/write_m1_evidence.py provenance
          printf 'HOST_ANDROID_HOME=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          cp gradle/verification-metadata.xml evidence/committed-verification-metadata.xml
          cp docs/build/m1-integrity.json evidence/committed-integrity-provenance.json
      - name: Install unchanged exact project JDK and SDK archives
        timeout-minutes: 15
        run: bash tools/build/install-hosted-toolchain.sh
      - name: Prepare hosted emulator client library
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p evidence/native
          # Ubuntu host prerequisite, not a project/toolchain version pin.
          library=/usr/lib/x86_64-linux-gnu/libpulse.so.0
          record_prerequisite() {
            status=$?
            trap - EXIT
            set +e
            {
              printf 'host_prerequisite_exit=%s\nlibrary=%s\n' "$status" "$library"
              dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' libpulse0
              printf 'package_query_exit=%s\n' "$?"
              if [[ -r "$library" ]]; then
                printf '%s\n' 'library_readable=true'
                readlink -f "$library"
                sha256sum "$library"
              else
                printf '%s\n' 'library_readable=false'
              fi
            } > evidence/native/host-libpulse0-receipt.txt 2>&1
            exit "$status"
          }
          trap record_prerequisite EXIT
          timeout --signal=TERM --kill-after=15s 2m sudo apt-get -o APT::Update::Error-Mode=any update \
            2>&1 | tee evidence/native/host-apt-update.log
          timeout --signal=TERM --kill-after=15s 2m sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends libpulse0 \
            2>&1 | tee evidence/native/host-libpulse0-install.log
          dpkg-query -W -f='${db:Status-Status}\n' libpulse0 | grep -Fx installed
          test -r "$library"
      - name: Require hosted KVM access
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run complete M1 native graph on API 36 phone (strict fresh home)
        timeout-minutes: 35
        run: timeout --signal=TERM --kill-after=30s 32m bash tools/build/run-hosted-native-smoke.sh
      - name: Bind native evidence and exact APK/report bytes (all outcomes)
        if: always()
        run: python3 tools/build/write_m1_evidence.py manifest
      - name: Upload native evidence (all outcomes; screenshots diagnostic only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/
            app/build/intermediates/merged_manifests/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
