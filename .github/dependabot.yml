version: 2
updates:
  # SHA-pinned Actions do not receive Dependabot alerts or security-update PRs;
  # the weekly version-update scan is the automated Actions update path.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Strict verification and the reviewed graph digest intentionally block an
  # update until a maintainer audits and adds its checksum delta. No bypass.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(gradle)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Dependabot discovers requirements*.txt and updates their --hash values.
  # Covers both requirements-metrics.txt and requirements-policy.txt.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(python)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/tools/research"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(python)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
