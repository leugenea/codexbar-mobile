// Applied by the app build, not only a hosted init script: local gates are fresh too.
// Compile/dex/resources/package tasks retain their normal cacheability.
def gateNames = [
    'prepareDebugCoverage', 'testDebugUnitTest', 'connectedDebugAndroidTest',
    'collectDebugCoverageInputs', 'jacocoDebugReport', 'jacocoDebugCoverageVerification',
    'verifyResolvedToolchain'
]
def isGate = { task -> task.project == project &&
    (task.name in gateNames || task.name.startsWith('lint')) }

tasks.configureEach { task ->
    if (isGate(task)) {
        task.outputs.upToDateWhen { false }
        task.outputs.doNotCacheIf('Verification and observation must execute every invocation') { true }
    }
}

String gateOutcome(state) {
    if (state.failure) return 'FAILED'
    if (state.noSource) return 'NO_SOURCE'
    if (state.skipMessage == 'FROM-CACHE') return 'FROM_CACHE'
    if (state.upToDate) return 'UP_TO_DATE'
    if (state.skipped) return 'SKIPPED'
    return 'SUCCESS'
}

// Terminal states, not start banners; keep configuration cache disabled.
gradle.taskGraph.afterTask { task, state ->
    if (isGate(task)) {
        def outcome = gateOutcome(state)
        logger.lifecycle("GATE_TASK_OUTCOME ${task.path} ${outcome}")
        if (!(outcome in ['SUCCESS', 'FAILED'])) {
            throw new GradleException("Required gate did not execute: ${task.path} ${outcome}")
        }
    }
}
